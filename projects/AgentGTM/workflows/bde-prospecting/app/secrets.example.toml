# Streamlit secrets for Google sign-in. Never commit the real file.
# Locally: copy to .streamlit/secrets.toml in the folder you run streamlit from.
# Cloud Run: store it in Secret Manager and mount it at /app/.streamlit/secrets.toml.

[auth]
redirect_uri = "https://YOUR-APP-URL/oauth2callback"   # local: http://localhost:8501/oauth2callback
cookie_secret = "LONG-RANDOM-STRING"                    # python -c "import secrets; print(secrets.token_urlsafe(48))"

[auth.google]
client_id = "XXXX.apps.googleusercontent.com"
client_secret = "XXXX"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

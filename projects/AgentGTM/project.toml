# Project manifest. scripts/validate.py checks this file.

[project]
name = "AgentGTM"                 # must match the folder name under projects/
description = "AI agentic workflows for go-to-market work."
owner = "hsaiyed"
status = "active"                 # experimental | active | deprecated

[interfaces]
# Other projects whose contracts this project uses. It may reference
# projects/<Name>/contracts/ only for projects listed here, and nothing else in them.
depends_on = []

# Files under contracts/ that other projects may rely on, e.g. "lead.v1.schema.json".
# Treat each one as a public API: never make a breaking change in place; add a .v2 file.
exposes = []
